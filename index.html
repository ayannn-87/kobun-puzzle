<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- スマホでも見やすいようにビューポートを設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雅ラン ― 古文助動詞パズル</title>

<!-- Googleフォント読み込み：見出し・和文用(Shippori Mincho) / 本文・UI用(Zen Kaku Gothic New) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 夜空の背景演出：星・月・桜（すべて装飾でクリック不可） -->
<div id="night-sky" aria-hidden="true">
  <div id="stars"></div>
  <div id="moon"></div>
</div>
<div id="sakura-layer" aria-hidden="true"></div>

<div id="app">

  <!-- ============================== -->
  <!-- ① タイトル画面（難易度選択）      -->
  <!-- ============================== -->
  <section id="screen-title" class="screen is-active">
    <div class="title-panel washi-panel">
      <p class="eyebrow">夜の平安 古典学習</p>
      <h1 class="game-logo">雅<span>ラン</span></h1>
      <p class="game-sub">散らばった活用語を並べ替えて、古文助動詞の活用表を月明かりの下で完成させましょう。</p>

      <div class="difficulty-select">
        <button class="diff-btn" data-difficulty="beginner">
          <span class="diff-name">初級</span>
          <span class="diff-desc">色ヒントあり・学習メモつき</span>
        </button>
        <button class="diff-btn" data-difficulty="intermediate">
          <span class="diff-name">中級</span>
          <span class="diff-desc">色ヒント弱め・タイマー表示</span>
        </button>
        <button class="diff-btn" data-difficulty="advanced">
          <span class="diff-name">上級</span>
          <span class="diff-desc">色ヒントなし・ダミーマス混入</span>
        </button>
      </div>

      <p class="rule-hint">マスをタップして2つ選ぶと入れ替わります。指で直接ドラッグしての入れ替えにも対応。</p>
    </div>
  </section>

  <!-- ============================== -->
  <!-- ② ゲーム画面                     -->
  <!-- ============================== -->
  <section id="screen-game" class="screen">
    <header class="game-header">
      <button id="btn-back-title" class="ghost-btn" aria-label="タイトルへ戻る">← タイトル</button>

      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">得点</span>
          <span class="hud-value" id="hud-score">0</span>
        </div>
        <div class="hud-item" id="hud-combo-wrap">
          <span class="hud-label">連続</span>
          <span class="hud-value" id="hud-combo">0</span>
        </div>
        <div class="hud-item" id="hud-timer-wrap">
          <span class="hud-label">時間</span>
          <span class="hud-value" id="hud-timer">00:00</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">完成</span>
          <span class="hud-value"><span id="hud-cleared">0</span>/6</span>
        </div>
      </div>
    </header>

    <!-- 色ヒントの凡例（難易度によって表示/非表示を切り替える） -->
    <div id="hint-legend" class="hint-legend"></div>

    <!-- 盤面本体：列見出し＋マスのグリッド -->
    <div class="board-wrap washi-panel">
      <div id="board" class="board"></div>
    </div>

    <p id="toast" class="toast" aria-live="polite"></p>
  </section>

  <!-- ============================== -->
  <!-- ③ クリア画面（オーバーレイ）       -->
  <!-- ============================== -->
  <section id="screen-clear" class="screen">
    <div class="clear-panel washi-panel">
      <p class="clear-eyebrow">全巻完成</p>
      <h2 class="clear-title">活用表、完成いたしました</h2>

      <div class="clear-rank" id="clear-rank">S</div>

      <dl class="clear-stats">
        <div class="clear-stat">
          <dt>クリアタイム</dt>
          <dd id="clear-time">00:00</dd>
        </div>
        <div class="clear-stat">
          <dt>総スコア</dt>
          <dd id="clear-score">0</dd>
        </div>
        <div class="clear-stat">
          <dt>完成行数</dt>
          <dd id="clear-rows">6 / 6</dd>
        </div>
      </dl>

      <div class="clear-buttons">
        <button id="btn-retry" class="primary-btn">もう一度遊ぶ</button>
        <button id="btn-to-title" class="ghost-btn">タイトルへ戻る</button>
      </div>
    </div>
  </section>

</div>

<!-- ============================== -->
<!-- ④ 学習メモ モーダル（初級モード限定）
     表示順：助動詞名 → 接続 → 意味一覧 → 活用 → 識別のポイント → 例文 -->
<!-- ============================== -->
<div id="learn-modal" class="modal-overlay">
  <div class="learn-card">
    <p class="learn-eyebrow">学習メモ</p>
    <h3 id="learn-name">―</h3>
    <p class="learn-connection-line">接続：<span id="learn-connection"></span></p>

    <div class="learn-section">
      <p class="learn-section-title">意味</p>
      <ul id="learn-meanings" class="learn-meaning-list"></ul>
    </div>

    <div class="learn-section">
      <p class="learn-section-title">活用</p>
      <p id="learn-forms" class="learn-forms-line"></p>
    </div>

    <div class="learn-section">
      <p class="learn-section-title">識別のポイント</p>
      <p id="learn-notes" class="learn-notes-text"></p>
    </div>

    <div class="learn-section">
      <p class="learn-section-title">例文</p>
      <ul id="learn-examples" class="learn-example-list"></ul>
    </div>

    <button id="learn-close" class="primary-btn">閉じる</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
